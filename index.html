<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>My To-Do List</h1>
            <p>Stay organized and productive</p>
        </header>

        <main>
            <form class="todo-form">
                <div class="form-group">
                    <label for="todo-input">Add New Task</label>
                    <div class="input-wrapper">
                        <input type="text" id="todo-input" name="task" placeholder="What do you need to do?" required>
                        <button type="submit" class="add-btn">Add Task</button>
                    </div>
                </div>
            </form>
            <section class="todo-container">
                <ul class="todo-list">
                    <!-- Sample todos - you'll add/remove these with JavaScript later -->
                    <li class="todo-item">
                        <input type="checkbox" id="task1" class="checkbox">
                        <label for="task1">Complete bug bounty report</label>
                        <button class="delete-btn">&times;</button>
                    </li>
                    <li class="todo-item">
                        <input type="checkbox" id="task2" class="checkbox">
                        <label for="task2">Test new feature on Lunacal.ai</label>
                        <button class="delete-btn">&times;</button>
                    </li>
                    <li class="todo-item completed">
                        <input type="checkbox" id="task3" class="checkbox" checked>
                        <label for="task3">Gym workout</label>
                        <button class="delete-btn">&times;</button>
                    </li>
                </ul>

                <div class="todo-stats">
                    <span class="stat-item">Total: <strong>3</strong></span>
                    <span class="stat-item">Active: <strong>2</strong></span>
                    <span class="stat-item">Completed: <strong>1</strong></span>
                </div>
            </section>
        </main>

        <footer>
            <p>&copy; 2026 To-Do List App By Anupam Singh</p>
        </footer>
    </div>
</body>

</html>
